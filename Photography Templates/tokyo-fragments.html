<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tokyo Fragments — Stories From Abroad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--text:#f0ece3;--accent:#c8321f;--gold:#b8925a;--dim:#585350;--border:rgba(240,236,227,.08);--border2:rgba(240,236,227,.16);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;overflow-x:hidden;}
nav{position:fixed;top:0;left:0;right:0;z-index:300;display:flex;justify-content:space-between;align-items:center;padding:22px 48px;pointer-events:none;}
nav a,nav span{pointer-events:all;}
.nav-back{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--text);text-decoration:none;opacity:0;transition:opacity .3s;}
.nav-back:hover{opacity:1;}
.nav-logo{font-size:11px;font-weight:600;letter-spacing:.4em;text-transform:uppercase;opacity:0;transition:opacity .3s;}

/* ── FIXED FULL OVERLAY ── */
#titleOverlay{
  position:fixed;inset:0;z-index:100;pointer-events:none;
  display:flex;align-items:flex-end;padding:0 60px 68px;
  transition:opacity .5s ease;
}
#titleOverlay::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,8,.82) 0%,rgba(8,8,8,.2) 45%,transparent 70%);pointer-events:none;}
.to-inner{position:relative;z-index:2;animation:fadeUp .9s cubic-bezier(.16,1,.3,1) .3s both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.to-eyebrow{font-size:10px;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;display:block;}
.to-title{font-family:'Cormorant Garamond',serif;font-size:clamp(56px,8vw,118px);font-weight:300;line-height:.88;}
.to-t1{display:block;}.to-t2{display:block;font-style:italic;color:var(--gold);}
.to-meta{display:flex;align-items:center;gap:20px;margin-top:24px;padding-top:18px;border-top:1px solid rgba(240,236,227,.1);}
.to-meta span{font-size:11px;letter-spacing:.15em;color:rgba(240,236,227,.45);}
.to-sep{width:20px;height:1px;background:rgba(240,236,227,.15);flex-shrink:0;}

/* ── SLIM BAR ── */
#titleBar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 48px;
  background:rgba(8,8,8,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  opacity:0;transition:opacity .4s ease;
  pointer-events:none;
}
#titleBar.visible{pointer-events:all;}
.tb-name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:300;font-style:italic;color:var(--gold);letter-spacing:.04em;}
.tb-right{display:flex;align-items:center;gap:20px;}
.tb-frames{font-size:10px;letter-spacing:.2em;color:var(--dim);}
.tb-back{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text);text-decoration:none;opacity:.5;transition:opacity .2s;}
.tb-back:hover{opacity:1;}


.photo-full{height:100vh;background:#000;display:flex;align-items:center;justify-content:center;}
.photo-full .pw{width:100%;height:100%;}
.photo-full .pw img{width:100%;height:100%;object-fit:contain;background:#000;display:block;}
.photo-row{display:flex;gap:2px;background:#000;}
.photo-row .pw{min-width:0;height:100%;background:#000;}
.photo-row .pw img{width:100%;height:100%;object-fit:contain;background:#000;display:block;}
.pw{position:relative;overflow:hidden;cursor:pointer;display:block;}
.pw img{transition:filter .45s ease;}
.pw:hover img{filter:brightness(1.06) contrast(1.02);}
.pw-cap{position:absolute;bottom:0;left:0;right:0;padding:52px 24px 20px;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.38) 60%,transparent);transform:translateY(100%);transition:transform .38s cubic-bezier(.16,1,.3,1);z-index:2;}
.pw:hover .pw-cap{transform:translateY(0);}
.cap-text{font-size:15px;font-style:italic;font-weight:300;line-height:1.45;color:rgba(255,255,255,.9);margin-bottom:5px;}
.cap-loc{font-size:9px;letter-spacing:.25em;text-transform:uppercase;}
.i-btn{position:absolute;top:14px;right:14px;z-index:3;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);font-size:13px;font-style:italic;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .25s,background .2s;backdrop-filter:blur(6px);}
.pw:hover .i-btn{opacity:1;}
.meta-tooltip{position:absolute;top:48px;right:14px;z-index:10;min-width:210px;background:rgba(8,8,8,.97);border:1px solid var(--border2);backdrop-filter:blur(12px);padding:14px;opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;pointer-events:none;}
.meta-tooltip.show{opacity:1;transform:translateY(0);pointer-events:all;}
.mt-row{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px;}
.mt-row:last-child{border-bottom:none;}
.mt-k{color:var(--dim);letter-spacing:.08em;}.mt-v{color:var(--text);font-weight:500;}

.cap-loc{color:var(--gold);}
.i-btn{font-family:'Cormorant Garamond',serif;}
.i-btn:hover{background:rgba(200,50,31,.55);border-color:var(--accent);color:#fff;}

.shoot-footer{display:flex;justify-content:space-between;align-items:flex-end;padding:64px 60px;border-top:1px solid var(--border);}
.sf-ghost{font-family:'Cormorant Garamond',serif;font-size:clamp(44px,6vw,88px);font-weight:300;color:rgba(240,236,227,.05);line-height:1;user-select:none;}
.sf-right{text-align:right;display:flex;flex-direction:column;gap:12px;align-items:flex-end;}
.sf-info{font-size:10px;letter-spacing:.15em;color:var(--dim);}
.sf-back{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--text);text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:2px;transition:color .2s;}
.sf-back:hover{color:var(--gold);}


#lb{position:fixed;inset:0;z-index:500;background:rgba(4,4,4,0.98);opacity:0;pointer-events:none;transition:opacity 0.3s;display:flex;flex-direction:row;}
#lb.open{opacity:1;pointer-events:all;}
.lb-img-area{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px 60px 60px;height:100%;}
.lb-img-area img{max-height:calc(100vh - 120px);max-width:100%;width:auto;height:auto;object-fit:contain;display:block;}
.lb-panel{width:310px;min-width:310px;height:100vh;padding:80px 40px 56px 32px;display:flex;flex-direction:column;overflow-y:auto;border-left:1px solid var(--border);flex-shrink:0;}
.lb-loc{font-size:9px;letter-spacing:0.3em;text-transform:uppercase;margin-bottom:10px;}
.lb-cap{font-size:20px;font-style:italic;font-weight:300;line-height:1.45;flex:1;margin-bottom:0;}
.lb-meta{margin-top:26px;padding-top:20px;border-top:1px solid var(--border);}
.lb-meta-ttl{font-size:9px;letter-spacing:0.3em;text-transform:uppercase;margin-bottom:12px;}
.lb-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;}
.lb-mi{display:flex;flex-direction:column;gap:3px;}
.lb-mi-k{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;}
.lb-mi-v{font-size:13px;font-weight:400;letter-spacing:0.04em;}
.lb-actions{display:flex;flex-direction:column;gap:9px;margin-top:26px;}
.lb-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;background:transparent;border:1px solid var(--border2);color:var(--text);font-size:9px;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:background .2s,border-color .2s,color .2s;}
.lb-close{position:absolute;top:20px;right:28px;background:transparent;border:none;cursor:pointer;font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text);opacity:.3;transition:opacity .2s;z-index:10;padding:8px;}
.lb-close:hover{opacity:1;}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:transparent;border:1px solid var(--border);color:var(--text);width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.25;transition:opacity .2s;font-size:15px;}
.lb-nav:hover{opacity:1;}
.lb-nav.lb-prev{left:14px;}.lb-nav.lb-next{right:326px;}
.lb-counter{position:absolute;bottom:18px;left:calc(50% - 155px);transform:translateX(-50%);font-size:9px;letter-spacing:.22em;}

.lb-loc{color:var(--gold);font-family:'Barlow Condensed',sans-serif;}
.lb-cap{font-family:'Cormorant Garamond',serif;color:var(--text);}
.lb-meta-ttl{color:var(--dim);font-family:'Barlow Condensed',sans-serif;}
.lb-mi-k{color:var(--dim);font-family:'Barlow Condensed',sans-serif;}
.lb-mi-v{font-family:'Barlow Condensed',sans-serif;}
.lb-btn{font-family:'Barlow Condensed',sans-serif;}
.lb-btn:hover{background:var(--accent);border-color:var(--accent);}
</style>
</head>
<body>
<nav>
  <a href="../" class="nav-back">← Photography</a>
  <span class="nav-logo">SFA</span>
</nav>

<div id="titleOverlay">
  <div class="to-inner">
    <span class="to-eyebrow">Tokyo, Japan &nbsp;·&nbsp; November 2024</span>
    <h1 class="to-title"><span class="to-t1">TOKYO</span><span class="to-t2">Fragments</span></h1>
    <div class="to-meta">
      <span>12 Frames</span><div class="to-sep"></div><span>Sony A7 IV</span><div class="to-sep"></div><span>Editorial</span>
    </div>
  </div>
</div>

<div id="titleBar">
  <span class="tb-name">Tokyo Fragments</span>
  <div class="tb-right">
    <span class="tb-frames">12 frames</span>
    <a href="../" class="tb-back">← All Shoots</a>
  </div>
</div>

<div id="full-0"></div>
<div id="row-1"></div>
<div id="full-5"></div>
<div id="row-6"></div>
<div id="full-9"></div>
<div id="row-10"></div>

<footer class="shoot-footer">
  <div class="sf-ghost">TOKYO<br>FRAGMENTS</div>
  <div class="sf-right">
    <span class="sf-info">12 frames &nbsp;·&nbsp; November 2024 &nbsp;·&nbsp; Sony A7 IV</span>
    <a href="../" class="sf-back">← All Shoots</a>
  </div>
</footer>

<div id="lb">
  <button class="lb-close" onclick="closeLb()">ESC ✕</button>
  <button class="lb-nav lb-prev" onclick="navLb(-1)">←</button>
  <button class="lb-nav lb-next" onclick="navLb(1)">→</button>
  <div class="lb-counter" id="lb-counter"></div>
  <div class="lb-img-area"><img id="lb-img" src="" alt=""></div>
  <div class="lb-panel">
    <div style="flex:1">
      <p class="lb-loc" id="lb-loc"></p>
      <p class="lb-cap" id="lb-cap"></p>
      <div class="lb-meta"><p class="lb-meta-ttl">Camera Data</p><div class="lb-meta-grid" id="lb-meta-grid"></div></div>
    </div>
    <div class="lb-actions" id="lb-actions">
      <button class="lb-btn" onclick="sharePhoto()">↗ Share</button>
      <a class="lb-btn" id="lb-dl" href="#" download="photo.jpg">↓ Save</a>
    </div>
  </div>
</div>
<script>
const photos=[
  {w:1600,h:900, src:'https://picsum.photos/seed/tky-cross-night/1600/900', caption:'Shibuya crossing at 2am — the city finally exhales.',         loc:'Shibuya, Tokyo',      date:'Nov 12, 2024',meta:{Camera:'Sony A7 IV',Lens:'35mm f/1.8',ISO:'3200',Shutter:'1/60s', Aperture:'f/1.8',Mode:'Manual'}},
  {w:800,h:1200, src:'https://picsum.photos/seed/tky-port-a/800/1200',     caption:'The commuter disappears into the machine.',                    loc:'Yamanote Line, Tokyo',date:'Nov 9, 2024', meta:{Camera:'Sony A7 IV',Lens:'50mm f/1.2',ISO:'2000',Shutter:'1/80s', Aperture:'f/1.2',Mode:'Manual'}},
  {w:800,h:1200, src:'https://picsum.photos/seed/tky-port-b/800/1200',     caption:'Every alley in Yanaka holds a century of quiet.',              loc:'Yanaka, Tokyo',       date:'Nov 9, 2024', meta:{Camera:'Sony A7 IV',Lens:'35mm f/1.8',ISO:'1600',Shutter:'1/60s', Aperture:'f/2',  Mode:'Manual'}},
  {w:800,h:1200, src:'https://picsum.photos/seed/tky-port-c/800/1200',     caption:'Neon bleeds through paper walls in Kabukicho.',                loc:'Kabukicho, Tokyo',    date:'Nov 12, 2024',meta:{Camera:'Sony A7 IV',Lens:'85mm f/1.4',ISO:'3200',Shutter:'1/60s', Aperture:'f/2',  Mode:'Manual'}},
  {w:800,h:1200, src:'https://picsum.photos/seed/tky-port-d/800/1200',     caption:'Blue hour before the crowds arrive.',                          loc:'Asakusa, Tokyo',      date:'Nov 8, 2024', meta:{Camera:'Sony A7 IV',Lens:'24mm f/1.4',ISO:'400', Shutter:'1/125s',Aperture:'f/2.8',Mode:'Aperture'}},
  {w:1600,h:900, src:'https://picsum.photos/seed/tky-land-b/1600/900',     caption:'Vending machines as lanterns in the rain.',                    loc:'Akihabara, Tokyo',    date:'Nov 11, 2024',meta:{Camera:'Sony A7 IV',Lens:'35mm f/1.8',ISO:'6400',Shutter:'1/125s',Aperture:'f/2.8',Mode:'Manual'}},
  {w:800,h:1200, src:'https://picsum.photos/seed/tky-mix-a/800/1200',      caption:'A monk at Senso-ji, unhurried.',                               loc:'Asakusa, Tokyo',      date:'Nov 8, 2024', meta:{Camera:'Sony A7 IV',Lens:'85mm f/1.4',ISO:'320', Shutter:'1/500s',Aperture:'f/2',  Mode:'Aperture'}},
  {w:1600,h:900, src:'https://picsum.photos/seed/tky-mix-b/1600/900',      caption:'Izakaya smoke and golden hour on the same corner.',            loc:'Shinjuku, Tokyo',     date:'Nov 10, 2024',meta:{Camera:'Sony A7 IV',Lens:'35mm f/1.8',ISO:'200', Shutter:'1/250s',Aperture:'f/4',  Mode:'Aperture'}},
  {w:800,h:1200, src:'https://picsum.photos/seed/tky-mix-c/800/1200',      caption:'He waited for the train twenty minutes. I waited for him.',    loc:'Shinjuku Station',    date:'Nov 11, 2024',meta:{Camera:'Sony A7 IV',Lens:'50mm f/1.2',ISO:'1600',Shutter:'1/125s',Aperture:'f/1.4',Mode:'Manual'}},
  {w:800,h:1200, src:'https://picsum.photos/seed/tky-close/800/1200',      caption:'Still water in a city that never stops.',                      loc:'Koishikawa Korakuen', date:'Nov 10, 2024',meta:{Camera:'Sony A7 IV',Lens:'85mm f/1.4',ISO:'640', Shutter:'1/250s',Aperture:'f/2',  Mode:'Manual'}},
  {w:1600,h:900, src:'https://picsum.photos/seed/tky-pair-a/1600/900',     caption:'Sunrise from Odaiba — a city made of borrowed light.',         loc:'Odaiba, Tokyo Bay',   date:'Nov 13, 2024',meta:{Camera:'Sony A7 IV',Lens:'24mm f/1.4',ISO:'100', Shutter:'1/500s',Aperture:'f/8',  Mode:'Manual'}},
  {w:1600,h:900, src:'https://picsum.photos/seed/tky-pair-b/1600/900',     caption:'The city forgetting itself, briefly.',                         loc:'Meiji Shrine, Tokyo', date:'Nov 8, 2024', meta:{Camera:'Sony A7 IV',Lens:'24mm f/1.4',ISO:'200', Shutter:'1/200s',Aperture:'f/5.6',Mode:'Manual'}},
];

let curIdx=0;
function mkPW(idx){
  const p=photos[idx];
  const d=document.createElement('div');d.className='pw';
  d.innerHTML=`<img src="${p.src}" alt="${p.caption}" loading="lazy"><div class="pw-cap"><p class="cap-text">${p.caption}</p><p class="cap-loc">${p.loc}</p></div><button class="i-btn">i</button>`;
  d.addEventListener('click',()=>openLb(idx));
  d.querySelector('.i-btn').addEventListener('click',e=>{e.stopPropagation();toggleTT(idx,d.querySelector('.i-btn'));});
  return d;
}
function buildRow(id,indices,height){
  const row=document.createElement('div');row.className='photo-row';row.style.height=height+'px';
  indices.forEach(i=>{const p=photos[i];const pw=mkPW(i);pw.style.flex=p.w/p.h;row.appendChild(pw);});
  document.getElementById(id).appendChild(row);
}
function buildFull(id,idx){
  const wrap=document.createElement('div');wrap.className='photo-full';
  wrap.appendChild(mkPW(idx));document.getElementById(id).appendChild(wrap);
}
function openLb(idx){
  curIdx=idx;const p=photos[idx];
  const lb=document.getElementById('lb');lb.className='open';
  document.getElementById('lb-img').src=p.src;
  document.getElementById('lb-loc').textContent=p.loc+'  ·  '+p.date;
  document.getElementById('lb-cap').textContent=p.caption;
  document.getElementById('lb-counter').textContent=(idx+1)+' / '+photos.length;
  document.getElementById('lb-dl').href=p.src;
  const mg=document.getElementById('lb-meta-grid');mg.innerHTML='';
  if(p.meta)Object.entries(p.meta).forEach(([k,v])=>mg.innerHTML+=`<div class="lb-mi"><span class="lb-mi-k">${k}</span><span class="lb-mi-v">${v}</span></div>`);
  document.body.style.overflow='hidden';
}
function closeLb(){document.getElementById('lb').className='';document.body.style.overflow='';}
function navLb(d){let n=curIdx+d;if(n<0)n=photos.length-1;if(n>=photos.length)n=0;openLb(n);}
let activeTT=null;
function toggleTT(idx,btn){
  if(activeTT){activeTT.el.remove();const wb=activeTT.btn;activeTT=null;if(wb===btn)return;}
  const p=photos[idx];const tt=document.createElement('div');tt.className='meta-tooltip';
  if(p.meta)Object.entries(p.meta).forEach(([k,v])=>tt.innerHTML+=`<div class="mt-row"><span class="mt-k">${k}</span><span class="mt-v">${v}</span></div>`);
  btn.parentElement.appendChild(tt);requestAnimationFrame(()=>tt.classList.add('show'));
  activeTT={el:tt,btn};
  setTimeout(()=>document.addEventListener('click',()=>{tt.remove();activeTT=null;},{once:true}),20);
}
function sharePhoto(){
  if(navigator.share)navigator.share({title:document.title,url:window.location.href});
  else navigator.clipboard.writeText(window.location.href).then(()=>{const b=document.querySelector('#lb-actions .lb-btn');const o=b.innerHTML;b.innerHTML='✓ Copied';setTimeout(()=>b.innerHTML=o,2000);});
}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lb').classList.contains('open'))return;
  if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')navLb(1);if(e.key==='ArrowLeft')navLb(-1);
});
// Title: fixed overlay fades to slim bar
const overlay=document.getElementById('titleOverlay');
const bar=document.getElementById('titleBar');
window.addEventListener('scroll',()=>{
  const t=window.scrollY;
  const vh=window.innerHeight;
  // full overlay fades out over first 35% of vh
  const fullFade=Math.max(0,1-t/(vh*0.35));
  overlay.style.opacity=fullFade;
  overlay.style.pointerEvents=fullFade<0.05?'none':'all';
  // slim bar fades IN after 25% vh
  const barFade=Math.min(1,Math.max(0,(t-vh*0.25)/(vh*0.12)));
  bar.style.opacity=barFade;
},{passive:true});

buildFull('full-0',0);
buildRow('row-1',[1,2,3,4],window.innerHeight);
buildFull('full-5',5);
buildRow('row-6',[6,7,8],window.innerHeight);
buildFull('full-9',9);
buildRow('row-10',[10,11],Math.round(window.innerHeight*.6));
</script>
</body></html>
