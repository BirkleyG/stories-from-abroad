<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Desert Fill — Stories From Abroad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;1,400&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--text:#ede4d0;--sand:#c8a870;--dim:#504840;--border:rgba(237,228,208,.07);--border2:rgba(237,228,208,.15);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:#000;color:var(--text);font-family:'Raleway',sans-serif;overflow-x:hidden;}
nav{position:fixed;top:0;left:0;right:0;z-index:300;display:flex;justify-content:space-between;align-items:center;padding:22px 52px;pointer-events:none;}
nav a,nav span{pointer-events:all;}
.nav-back{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--text);text-decoration:none;opacity:0;transition:opacity .3s;}
.nav-back:hover{opacity:1;}
.nav-logo{font-size:11px;font-weight:500;letter-spacing:.45em;text-transform:uppercase;opacity:0;transition:opacity .3s;}

#titleOverlay{
  position:fixed;inset:0;z-index:100;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .5s ease;
}
#titleOverlay::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.62);}
.to-inner{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;animation:fadeIn 1s ease .3s both;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.to-tag{font-size:10px;letter-spacing:.55em;text-transform:uppercase;color:var(--sand);margin-bottom:20px;}
.to-title{font-family:'Libre Baskerville',serif;font-size:clamp(60px,9vw,136px);font-weight:400;line-height:.88;}
.to-t1{display:block;color:#fff;}.to-t2{display:block;font-style:italic;color:var(--sand);}
.to-sub{margin-top:22px;font-family:'Libre Baskerville',serif;font-size:15px;font-style:italic;color:rgba(237,228,208,.38);letter-spacing:.04em;}
.to-meta{display:flex;align-items:center;gap:20px;margin-top:22px;padding-top:18px;border-top:1px solid rgba(237,228,208,.08);}
.to-meta span{font-size:10px;letter-spacing:.2em;color:rgba(237,228,208,.32);}
.to-sep{width:20px;height:1px;background:rgba(237,228,208,.1);flex-shrink:0;}

#titleBar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 52px;
  background:rgba(0,0,0,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.06);
  opacity:0;transition:opacity .4s ease;
  pointer-events:none;
}
.tb-name{font-family:'Libre Baskerville',serif;font-size:17px;font-style:italic;color:var(--sand);}
.tb-right{display:flex;align-items:center;gap:20px;}
.tb-frames{font-size:10px;letter-spacing:.2em;color:var(--dim);}
.tb-back{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text);text-decoration:none;opacity:.45;transition:opacity .2s;}
.tb-back:hover{opacity:1;}

/* GRID — pure tile, zero gaps, rows sized to photo natural height */
#photoGrid{display:block;background:#000;}
.grid-row{display:flex;gap:0;background:#000;}
.grid-row .pw{min-width:0;background:#000;}
.grid-row .pw img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .45s ease;}
.grid-row .pw:hover img{filter:brightness(1.06);}

.pw{position:relative;overflow:hidden;cursor:pointer;display:block;}
.pw-cap{position:absolute;bottom:0;left:0;right:0;padding:52px 24px 20px;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.3) 60%,transparent);transform:translateY(100%);transition:transform .38s cubic-bezier(.16,1,.3,1);z-index:2;}
.pw:hover .pw-cap{transform:translateY(0);}
.cap-text{font-family:'Libre Baskerville',serif;font-size:15px;font-style:italic;font-weight:400;line-height:1.45;color:rgba(255,255,255,.9);margin-bottom:5px;}
.cap-loc{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--sand);}
.i-btn{position:absolute;top:14px;right:14px;z-index:3;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.65);font-family:'Libre Baskerville',serif;font-size:13px;font-style:italic;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .25s,background .2s;backdrop-filter:blur(6px);}
.pw:hover .i-btn{opacity:1;}
.i-btn:hover{background:rgba(200,168,112,.3);border-color:var(--sand);color:var(--sand);}
.meta-tooltip{position:absolute;top:48px;right:14px;z-index:10;min-width:210px;background:rgba(0,0,0,.97);border:1px solid var(--border2);backdrop-filter:blur(12px);padding:14px;opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;pointer-events:none;}
.meta-tooltip.show{opacity:1;transform:translateY(0);pointer-events:all;}
.mt-row{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px;}
.mt-row:last-child{border-bottom:none;}
.mt-k{color:var(--dim);}.mt-v{color:var(--text);font-weight:500;}


#lb{position:fixed;inset:0;z-index:500;background:rgba(4,4,4,0.98);opacity:0;pointer-events:none;transition:opacity 0.3s;display:flex;flex-direction:row;}
#lb.open{opacity:1;pointer-events:all;}
.lb-img-area{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px 60px 60px;height:100%;}
.lb-img-area img{max-height:calc(100vh - 120px);max-width:100%;width:auto;height:auto;object-fit:contain;display:block;}
.lb-panel{width:310px;min-width:310px;height:100vh;padding:80px 40px 56px 32px;display:flex;flex-direction:column;overflow-y:auto;border-left:1px solid var(--border);flex-shrink:0;}
.lb-loc{font-size:9px;letter-spacing:0.3em;text-transform:uppercase;margin-bottom:10px;}
.lb-cap{font-size:20px;font-style:italic;font-weight:300;line-height:1.45;flex:1;margin-bottom:0;}
.lb-meta{margin-top:26px;padding-top:20px;border-top:1px solid var(--border);}
.lb-meta-ttl{font-size:9px;letter-spacing:0.3em;text-transform:uppercase;margin-bottom:12px;}
.lb-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;}
.lb-mi{display:flex;flex-direction:column;gap:3px;}
.lb-mi-k{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;}
.lb-mi-v{font-size:13px;font-weight:400;letter-spacing:0.04em;}
.lb-actions{display:flex;flex-direction:column;gap:9px;margin-top:26px;}
.lb-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;background:transparent;border:1px solid var(--border2);color:var(--text);font-size:9px;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:background .2s,border-color .2s,color .2s;}
.lb-close{position:absolute;top:20px;right:28px;background:transparent;border:none;cursor:pointer;font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text);opacity:.3;transition:opacity .2s;z-index:10;padding:8px;}
.lb-close:hover{opacity:1;}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:transparent;border:1px solid var(--border);color:var(--text);width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.25;transition:opacity .2s;font-size:15px;}
.lb-nav:hover{opacity:1;}
.lb-nav.lb-prev{left:14px;}.lb-nav.lb-next{right:326px;}
.lb-counter{position:absolute;bottom:18px;left:calc(50% - 155px);transform:translateX(-50%);font-size:9px;letter-spacing:.22em;}

.lb-loc{color:var(--sand);font-family:'Raleway',sans-serif;}
.lb-cap{font-family:'Libre Baskerville',serif;font-style:italic;color:var(--text);}
.lb-meta-ttl,.lb-mi-k{color:var(--dim);font-family:'Raleway',sans-serif;}
.lb-mi-v{font-family:'Raleway',sans-serif;}
.lb-btn{font-family:'Raleway',sans-serif;}
.lb-btn:hover{background:var(--sand);border-color:var(--sand);color:#000;}
</style>
</head>
<body>
<nav>
  <a href="../" class="nav-back">← Photography</a>
  <span class="nav-logo">SFA</span>
</nav>

<div id="titleOverlay">
  <div class="to-inner">
    <p class="to-tag">Mojave Desert, USA &nbsp;·&nbsp; March 2024</p>
    <h1 class="to-title"><span class="to-t1">DESERT</span><span class="to-t2">Fill</span></h1>
    <p class="to-sub">Pure frame. Nothing between you and the image.</p>
    <div class="to-meta">
      <span>12 Frames</span><div class="to-sep"></div><span>Fuji X-T5</span><div class="to-sep"></div><span>No Borders</span>
    </div>
  </div>
</div>

<div id="titleBar">
  <span class="tb-name">Desert Fill</span>
  <div class="tb-right">
    <span class="tb-frames">12 frames</span>
    <a href="../" class="tb-back">← All Shoots</a>
  </div>
</div>

<div id="photoGrid"></div>

<div id="lb">
  <button class="lb-close" onclick="closeLb()">ESC ✕</button>
  <button class="lb-nav lb-prev" onclick="navLb(-1)">←</button>
  <button class="lb-nav lb-next" onclick="navLb(1)">→</button>
  <div class="lb-counter" id="lb-counter"></div>
  <div class="lb-img-area"><img id="lb-img" src="" alt=""></div>
  <div class="lb-panel">
    <div style="flex:1">
      <p class="lb-loc" id="lb-loc"></p>
      <p class="lb-cap" id="lb-cap"></p>
      <div class="lb-meta"><p class="lb-meta-ttl">Camera Data</p><div class="lb-meta-grid" id="lb-meta-grid"></div></div>
    </div>
    <div class="lb-actions" id="lb-actions">
      <button class="lb-btn" onclick="sharePhoto()">↗ Share</button>
      <a class="lb-btn" id="lb-dl" href="#" download="photo.jpg">↓ Save</a>
    </div>
  </div>
</div>
<script>
const photos=[
  {w:1600,h:900, src:'https://picsum.photos/seed/df-land-a/1600/900',  caption:'Five miles of nothing, then everything.',                          loc:'Mojave Desert, CA',  date:'Mar 16, 2024',meta:{Camera:'Fuji X-T5',Lens:'16mm f/2.8',ISO:'160', Shutter:'1/640s', Aperture:'f/8',  'Film Sim':'Classic Chrome'}},
  {w:800,h:1200, src:'https://picsum.photos/seed/df-port-a/800/1200',  caption:'A saguaro holds its arms wide for no one.',                         loc:'Mojave, CA',         date:'Mar 16, 2024',meta:{Camera:'Fuji X-T5',Lens:'56mm f/1.2',ISO:'200', Shutter:'1/800s', Aperture:'f/4',  'Film Sim':'Velvia'}},
  {w:800,h:1200, src:'https://picsum.photos/seed/df-port-b/800/1200',  caption:'Granite stacked with patience.',                                    loc:'Joshua Tree, CA',    date:'Mar 17, 2024',meta:{Camera:'Fuji X-T5',Lens:'56mm f/1.2',ISO:'320', Shutter:'1/250s', Aperture:'f/5.6','Film Sim':'Classic Chrome'}},
  {w:800,h:1200, src:'https://picsum.photos/seed/df-port-c/800/1200',  caption:'After the rains, the desert argues with color.',                    loc:'Antelope Valley, CA',date:'Mar 18, 2024',meta:{Camera:'Fuji X-T5',Lens:'90mm f/2',  ISO:'200', Shutter:'1/500s', Aperture:'f/2.8','Film Sim':'Velvia'}},
  {w:800,h:1200, src:'https://picsum.photos/seed/df-port-d/800/1200',  caption:'A Joshua tree at the right angle looks like something dreamed.',    loc:'Joshua Tree NP, CA', date:'Mar 18, 2024',meta:{Camera:'Fuji X-T5',Lens:'56mm f/1.2',ISO:'160', Shutter:'1/640s', Aperture:'f/2',  'Film Sim':'Classic Chrome'}},
  {w:1600,h:900, src:'https://picsum.photos/seed/df-land-b/1600/900',  caption:'The floor was cracked like a map of somewhere that no longer exists.',loc:'Mojave, CA',        date:'Mar 17, 2024',meta:{Camera:'Fuji X-T5',Lens:'23mm f/2',  ISO:'100', Shutter:'1/1000s',Aperture:'f/11', 'Film Sim':'Eterna'}},
  {w:1600,h:900, src:'https://picsum.photos/seed/df-land-c/1600/900',  caption:'The horizon line has no end and no beginning.',                     loc:'Mojave Desert, CA',  date:'Mar 17, 2024',meta:{Camera:'Fuji X-T5',Lens:'16mm f/2.8',ISO:'160', Shutter:'1/800s', Aperture:'f/8',  'Film Sim':'Classic Chrome'}},
  {w:800,h:1200, src:'https://picsum.photos/seed/df-port-e/800/1200',  caption:'My shadow grew longer than any ambition.',                          loc:'Mojave, CA',         date:'Mar 16, 2024',meta:{Camera:'Fuji X-T5',Lens:'56mm f/1.2',ISO:'200', Shutter:'1/640s', Aperture:'f/5.6','Film Sim':'Acros'}},
  {w:1600,h:900, src:'https://picsum.photos/seed/df-land-d/1600/900',  caption:'The light at 6pm lasts ten minutes and ruins ordinary days.',       loc:'Mojave Desert, CA',  date:'Mar 18, 2024',meta:{Camera:'Fuji X-T5',Lens:'16mm f/2.8',ISO:'100', Shutter:'1/320s', Aperture:'f/11', 'Film Sim':'Velvia'}},
  {w:800,h:1200, src:'https://picsum.photos/seed/df-port-f/800/1200',  caption:'The cactus flower lasts three days. We were there for one.',         loc:'Anza-Borrego, CA',   date:'Mar 19, 2024',meta:{Camera:'Fuji X-T5',Lens:'90mm f/2',  ISO:'320', Shutter:'1/400s', Aperture:'f/3.2','Film Sim':'Velvia'}},
  {w:800,h:1200, src:'https://picsum.photos/seed/df-port-g/800/1200',  caption:'Sand dune at last light. The wind erases everything.',               loc:'Kelso Dunes, CA',    date:'Mar 19, 2024',meta:{Camera:'Fuji X-T5',Lens:'56mm f/1.2',ISO:'400', Shutter:'1/200s', Aperture:'f/4',  'Film Sim':'Classic Chrome'}},
  {w:1600,h:900, src:'https://picsum.photos/seed/df-land-e/1600/900',  caption:'Stars you can only see when you forget the city exists.',            loc:'Mojave Desert, CA',  date:'Mar 20, 2024',meta:{Camera:'Fuji X-T5',Lens:'16mm f/2.8',ISO:'6400',Shutter:'25s',   Aperture:'f/2.8','Film Sim':'Acros'}},
];

let curIdx=0;
function mkPW(idx){
  const p=photos[idx];
  const d=document.createElement('div');d.className='pw';
  d.innerHTML=`<img src="${p.src}" alt="${p.caption}" loading="lazy"><div class="pw-cap"><p class="cap-text">${p.caption}</p><p class="cap-loc">${p.loc}</p></div><button class="i-btn">i</button>`;
  d.addEventListener('click',()=>openLb(idx));
  d.querySelector('.i-btn').addEventListener('click',e=>{e.stopPropagation();toggleTT(idx,d.querySelector('.i-btn'));});
  return d;
}

// Grid tiling: pack photos into rows, targeting ~viewport-width
// Each row tries to fill width at a target row height
function buildGrid(){
  const grid=document.getElementById('photoGrid');
  const vw=window.innerWidth;
  // Define rows manually for deliberate composition:
  // [indices, height]
  const rows=[
    [[0], vw/photos[0].w*photos[0].h],           // single landscape full-width
    [[1,2,3], vw/(photos[1].w/photos[1].h + photos[2].w/photos[2].h + photos[3].w/photos[3].h)], // 3 portraits
    [[4,5], vw/(photos[4].w/photos[4].h + photos[5].w/photos[5].h)],   // portrait + landscape
    [[6,7], vw/(photos[6].w/photos[6].h + photos[7].w/photos[7].h)],   // landscape + portrait
    [[8,9,10], vw/(photos[8].w/photos[8].h + photos[9].w/photos[9].h + photos[10].w/photos[10].h)], // land+port+port
    [[11], vw/photos[11].w*photos[11].h],         // closing landscape
  ];
  rows.forEach(([indices,h])=>{
    const row=document.createElement('div');row.className='grid-row';row.style.height=Math.round(h)+'px';
    indices.forEach(i=>{const p=photos[i];const pw=mkPW(i);pw.style.flex=p.w/p.h;row.appendChild(pw);});
    grid.appendChild(row);
  });
}

function openLb(idx){
  curIdx=idx;const p=photos[idx];
  const lb=document.getElementById('lb');lb.className='open';
  document.getElementById('lb-img').src=p.src;
  document.getElementById('lb-loc').textContent=p.loc+'  ·  '+p.date;
  document.getElementById('lb-cap').textContent=p.caption;
  document.getElementById('lb-counter').textContent=(idx+1)+' / '+photos.length;
  document.getElementById('lb-dl').href=p.src;
  const mg=document.getElementById('lb-meta-grid');mg.innerHTML='';
  if(p.meta)Object.entries(p.meta).forEach(([k,v])=>mg.innerHTML+=`<div class="lb-mi"><span class="lb-mi-k">${k}</span><span class="lb-mi-v">${v}</span></div>`);
  document.body.style.overflow='hidden';
}
function closeLb(){document.getElementById('lb').className='';document.body.style.overflow='';}
function navLb(d){let n=curIdx+d;if(n<0)n=photos.length-1;if(n>=photos.length)n=0;openLb(n);}
let activeTT=null;
function toggleTT(idx,btn){
  if(activeTT){activeTT.el.remove();const wb=activeTT.btn;activeTT=null;if(wb===btn)return;}
  const p=photos[idx];const tt=document.createElement('div');tt.className='meta-tooltip';
  if(p.meta)Object.entries(p.meta).forEach(([k,v])=>tt.innerHTML+=`<div class="mt-row"><span class="mt-k">${k}</span><span class="mt-v">${v}</span></div>`);
  btn.parentElement.appendChild(tt);requestAnimationFrame(()=>tt.classList.add('show'));
  activeTT={el:tt,btn};
  setTimeout(()=>document.addEventListener('click',()=>{tt.remove();activeTT=null;},{once:true}),20);
}
function sharePhoto(){
  if(navigator.share)navigator.share({title:document.title,url:window.location.href});
  else navigator.clipboard.writeText(window.location.href).then(()=>{const b=document.querySelector('#lb-actions .lb-btn');const o=b.innerHTML;b.innerHTML='✓ Copied';setTimeout(()=>b.innerHTML=o,2000);});
}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lb').classList.contains('open'))return;
  if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')navLb(1);if(e.key==='ArrowLeft')navLb(-1);
});
const overlay=document.getElementById('titleOverlay');
const bar=document.getElementById('titleBar');
window.addEventListener('scroll',()=>{
  const t=window.scrollY,vh=window.innerHeight;
  const ff=Math.max(0,1-t/(vh*0.35));
  overlay.style.opacity=ff;overlay.style.pointerEvents=ff<0.05?'none':'all';
  const bf=Math.min(1,Math.max(0,(t-vh*0.25)/(vh*0.12)));
  bar.style.opacity=bf;bar.style.pointerEvents=bf>0.05?'all':'none';
},{passive:true});

buildGrid();
</script>
</body></html>
